      </label>
      <button id="btn-clear" title="删除全部历史记录">清空历史</button>
    </div>
  </div>

  <div id="page-slot">
    <div id="page-slot-a"></div>
    <div id="split-gutter" title="拖动调整分屏比例"></div>
    <div id="page-slot-b"></div>
  </div>

  <div id="newtab" hidden>
    <div class="nt-head">收藏</div>
    <div id="nt-favs" class="nt-grid"></div>
    <div id="nt-empty" class="nt-empty" hidden>收藏的网页会出现在这里。打开一个网页，点地址栏右侧的 ★ 收藏。</div>
  </div>

  <script>
    (function () {
      var input = document.getElementById('url');
      var omnibox = document.getElementById('omnibox');
      var list = document.getElementById('omni-list');
      var btnStar = document.getElementById('btn-star');
      var pageSlot = document.getElementById('page-slot');
      var newtab = document.getElementById('newtab');
      var ntFavs = document.getElementById('nt-favs');
      var ntEmpty = document.getElementById('nt-empty');
      var chkPrivate = document.getElementById('chk-private');
      var chkSel = document.getElementById('chk-sel');
      var btnClear = document.getElementById('btn-clear');

      // Bind the host engine views. `#page-slot-a` carries the focused tab;
      // `#page-slot-b` carries the split's right pane (its tag is empty while
      // no split is engaged, and the pane itself is display:none so the slot
      // reports 0×0 — the host hides the view). A tab switch changes no DOM
      // size, so refresh() is what re-reports.
      var slotHandle = window.piSDK.liveSlot('page', document.getElementById('page-slot-a'), function () {
        // Each host tab is bound to ONE engine tab (the backend pushes it as
        // engineTabId). activeTabId is the legacy fallback.
        return state.engineTabId || state.activeTabId;
      });
      var slotBHandle = window.piSDK.liveSlot('page-b', document.getElementById('page-slot-b'), function () {
        var s = state.split;
        return s ? s[1] : '';
      });

      function act(method, params) {
        return window.piSDK.request(method, params).catch(function (e) {
          console.warn(method, e && e.message ? e.message : e);
        });
      }

      // ── Theme relay for the in-page selection popup ──
      // The popup lives in the web page, a separate document that never sees
      // the shell tokens this panel is styled with. Push them (and the
      // resolved light/dark) to the backend so the popup matches the app
      // instead of guessing from the OS preference.
      //
      // Only tokens the shell actually pushed count: the inline style is where
      // plugin-sdk-js lands them. Reading computed styles here would also pick
      // up this page's own blue-ish fallbacks and ship those to the popup,
      // which is worse than letting the popup use its own neutral fallbacks.
      var SEL_THEME_KEYS = [
        'background', 'foreground', 'card', 'card-foreground', 'muted', 'muted-foreground',
        'accent', 'accent-foreground', 'border', 'ring', 'primary', 'primary-foreground',
        'radius', 'font-sans'
      ];
      function selThemePayload() {
        var rootStyle = document.documentElement.style;
        var tokens = {};
        var count = 0;
        for (var i = 0; i < SEL_THEME_KEYS.length; i++) {
          var v = rootStyle.getPropertyValue('--' + SEL_THEME_KEYS[i]).trim();
          if (v) { tokens[SEL_THEME_KEYS[i]] = v; count++; }
        }
        if (!count) return null; // the shell has not pushed its palette yet
        // The token components are HSL, so the background's lightness is the
        // theme: 100% is light, 13% is dark.
        var dark = true;
        var m = /(\d+(?:\.\d+)?)%\s*$/.exec(tokens.background || tokens.foreground || '');
        if (m) dark = parseFloat(m[1]) < 50;
        else if (window.matchMedia) dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        return { dark: dark, tokens: tokens };
      }
      var selThemeTimer = null;
      function pushSelTheme() {
        selThemeTimer = null;
        var payload = selThemePayload();
        if (payload) act('sel.theme', payload);
      }
      new MutationObserver(function () {
        if (selThemeTimer) clearTimeout(selThemeTimer);
        selThemeTimer = setTimeout(pushSelTheme, 150);
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class'] });
      setTimeout(pushSelTheme, 400);

      // ── Whole-page translation row ──
      // All controls live in a real toolbar row above the engine view: a DOM
      // dropdown in this page would be covered by the native view below.
      var imtBtn = document.getElementById('btn-imt');
      var imtRow = document.getElementById('imt-row');
      var irModes = document.getElementById('ir-modes');
      var irMeta = document.getElementById('ir-meta');
      var irActions = document.getElementById('ir-actions');
      var irRead = document.getElementById('ir-read');
      var irRetry = document.getElementById('ir-retry');
      var irPause = irRead.querySelector('[data-imt-read="pause"]');
      var imtState = { mode: 'idle', done: 0, total: 0, read: null };
      var imtTranslated = false;

      function showRow(show) {
        imtRow.hidden = !show;
        paintImt();
        if (show) imtAct('imt.state', {});
      }

      function paintImt() {
        var st = imtState;
        var busy = st.mode === 'translating';
        imtBtn.classList.toggle('busy', busy);
        imtBtn.classList.toggle('on', !imtRow.hidden);
        imtBtn.classList.toggle('open', !imtRow.hidden);
        imtBtn.setAttribute('aria-expanded', imtRow.hidden ? 'false' : 'true');
        imtBtn.title = st.error
          ? '整页工具：' + st.error
          : (imtRow.hidden ? '整页工具：翻译 · 朗读 · 解释 · 分析 · 存正文' : '收起整页工具栏');

        var read = st.read;
        var translated = busy || st.mode === 'dual' || st.mode === 'replace' || st.mode === 'source';
        imtTranslated = translated;
        irModes.hidden = !!read;
        irActions.hidden = !!read;
        irRead.hidden = !read;
        irModes.querySelectorAll('button[data-imt-mode]').forEach(function (b) {
          var mode = b.getAttribute('data-imt-mode');
          b.classList.toggle('on', mode === st.mode);
          b.disabled = mode === 'source' && !translated;
        });

        var failed = st.failed || 0;
        irRetry.hidden = failed === 0;
        irRetry.textContent = '重试 ' + failed;
        irRetry.title = '有 ' + failed + ' 段翻译失败，点此重试';

        // 解释/分析 send a request card to the conversation and return at once;
        // the answer is written there by the agent, not drawn in this panel.
        irActions.querySelectorAll('button').forEach(function (b) { b.disabled = !!imtPending; });

        var meta = '';
        if (read) {
          meta = '朗读中 ' + ((read.index || 0) + 1) + '/' + (read.total || 0) + (read.layer ? ' · ' + read.layer : '');
          irPause.textContent = read.paused ? '▶' : '❚❚';
          irPause.title = read.paused ? '继续' : '暂停';
        } else if (busy) {
          meta = (st.done || 0) + '/' + (st.total || 0);
        }
        irMeta.textContent = imtError || imtPending || meta;
        irMeta.style.color = imtError ? 'hsl(0 65% 65%)' : '';
      }

      var imtError = '';
      var imtPending = '';
      function renderImt(st) {
        if (!st) return;
        imtState = st;
        imtError = st.error || '';
        paintImt();
      }

      function imtAct(method, params) {
        imtError = '';
        var sending = method === 'imt.explain' || method === 'imt.analyze';
        if (sending) imtPending = '发送中…';
        paintImt();
        return window.piSDK.request(method, params).then(function (st) {
          if (st && typeof st === 'object' && st.mode) renderImt(st);
          // The request card is in the conversation timeline now; say so long
          // enough to be read, then hand the meta slot back.
          if (sending) {
            imtPending = '已发到对话';
            setTimeout(function () {
              if (imtPending === '已发到对话') { imtPending = ''; paintImt(); }
            }, 2400);
          }
          return st;
        }).catch(function (e) {
          imtError = (e && e.message) ? e.message : '操作失败';
          if (imtRow.hidden) imtRow.hidden = false;
        }).then(function (st) {
          if (!sending) imtPending = '';
          if (!imtPending) paintImt();
          return st;
        });
      }

      imtBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        showRow(imtRow.hidden);
      });
      document.getElementById('ir-close').addEventListener('click', function () { showRow(false); });
      imtRow.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.id === 'ir-retry') { imtAct('imt.retry', {}); return; }
        var v;
        if ((v = b.getAttribute('data-imt-mode'))) {
          if (v === 'source' && !imtTranslated) return;
          imtAct(imtTranslated ? 'imt.mode' : 'imt.start', { mode: v });
        }
        else if ((v = b.getAttribute('data-imt-act'))) imtAct('imt.' + v, {});
        else if ((v = b.getAttribute('data-imt-read'))) {
          if (v === 'pause') imtAct('imt.readPause', {});
          else if (v === 'next') imtAct('imt.readNext', {});
          else if (v === 'prev') imtAct('imt.readPrev', {});
          else imtAct('imt.readStop', {});
        }
      });
      paintImt();

      // ── Tab strip ──
      var tabsEl = document.getElementById('tabs');
      function applySplitClass() {
        var on = !!(state.split && state.split[1]);
        document.body.classList.toggle('split', on);
        // Pane widths follow the remembered ratio (primary's share).
        var paneA = document.getElementById('page-slot-a');
        if (on) {
          var r = Math.min(0.8, Math.max(0.2, state.splitRatio || 0.5));
          paneA.style.flex = '0 0 ' + (r * 100).toFixed(2) + '%';
        } else {
          paneA.style.flex = '';
        }
      }
      // The split sash: the single divider between the two panes. Invisible
      // wide hit area; hover thickens the line and shows a grip; drag shows a
      // live share pill; double-click resets to 50/50; arrows nudge by 2%.
      // The ratio persists per conversation (backend split.ratio).
      (function () {
        var gutter = document.getElementById('split-gutter');
        var region = document.getElementById('page-slot');
        var tip = document.createElement('div');
        tip.id = 'split-tip';
        document.body.appendChild(tip);
        var SNAP = 0.025;
        var clamp = function (r) { return Math.min(0.8, Math.max(0.2, r)); };
        var setRatio = function (r) {
          state.splitRatio = r;
          applySplitClass();
        };
        gutter.tabIndex = 0;
        gutter.setAttribute('role', 'separator');
        gutter.setAttribute('aria-orientation', 'vertical');
        gutter.setAttribute('aria-label', '拖动调整分屏比例（双击复位为对半，方向键微调）');
        gutter.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          gutter.classList.add('drag');
          if (gutter.setPointerCapture) { try { gutter.setPointerCapture(e.pointerId); } catch (err) {} }
          var move = function (ev) {
            var rect = region.getBoundingClientRect();
            if (rect.width <= 0) return;
            var ratio = (ev.clientX - rect.left) / rect.width;
            if (Math.abs(ratio - 0.5) < SNAP) ratio = 0.5;
            setRatio(clamp(ratio));
            tip.style.display = 'block';
            tip.style.left = ev.clientX + 'px';
            tip.style.top = rect.top + 10 + 'px';
            tip.textContent = Math.round(state.splitRatio * 100) + ' · ' + Math.round((1 - state.splitRatio) * 100);
          };
          var up = function () {
            gutter.classList.remove('drag');
            tip.style.display = 'none';
            gutter.removeEventListener('pointermove', move);
            gutter.removeEventListener('pointerup', up);
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            act('split.ratio', { ratio: state.splitRatio });
          };
          if (gutter.setPointerCapture) {
            gutter.addEventListener('pointermove', move);
            gutter.addEventListener('pointerup', up);
          } else {
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
          }
        });
        gutter.addEventListener('dblclick', function () {
          setRatio(0.5);
          act('split.ratio', { ratio: 0.5 });
        });
        gutter.addEventListener('keydown', function (e) {
          var next = null;
          if (e.key === 'ArrowLeft') next = clamp(state.splitRatio - 0.02);
          else if (e.key === 'ArrowRight') next = clamp(state.splitRatio + 0.02);
          else if (e.key === 'Home') next = 0.2;
          else if (e.key === 'End') next = 0.8;
          if (next != null) {
            e.preventDefault();
            setRatio(next);
            act('split.ratio', { ratio: next });
          }
        });
      })();
      // Native popup menu (OS-level — floats above the engine views, unlike
      // any DOM dropdown in this page). No unsplit item: closing a split tab
      // (its ×) collapses the split, so the menu only ever offers the split.
      function openTabMenu(tab) {
        window.piSDK.showPopupMenu([{ id: 'split-right', label: '向右拆分' }], lastMouse.x, lastMouse.y).then(function (picked) {
          if (picked === 'split-right') {
            var right = (state.tabs.find(function (t) { return t.id !== tab.id && !t.evicted; }) || {}).id;
            if (right) act('split.set', { tabs: [tab.id, right], ratio: state.splitRatio });
          }
        });
      }
      var lastMouse = { x: 0, y: 0 };
      function makeChip(t, split) {
        var isSplitRight = !!(split && split[1] === t.id);
        var el = document.createElement('div');
        el.className = 'tab on';
        el.draggable = true;
        el.dataset.tabId = t.id;
        var label = document.createElement('span');
        label.textContent = t.title || shortUrl(t.url) || '新标签页';
        el.title = t.url || '';
        el.appendChild(label);
        var x = document.createElement('button');
        x.className = 'x';
        x.textContent = '×';
        x.setAttribute('aria-label', '关闭标签页');
        x.onclick = function (e) { e.stopPropagation(); act('tabs.close', { tabId: t.id }); };
        el.appendChild(x);
        el.onclick = function () {
          // Both split panes are visible — clicking a chip swaps which side
          // it renders on instead of doubling it into the left pane.
          if (split && split[1] === t.id && split[0] !== t.id) {
            act('split.set', { tabs: [t.id, split[0]], ratio: state.splitRatio });
            return;
          }
          act('tabs.activate', { tabId: t.id });
        };
        el.oncontextmenu = function (e) {
          e.preventDefault();
          e.stopPropagation();
          lastMouse.x = e.clientX; lastMouse.y = e.clientY;
          openTabMenu(t);
        };
        el.ondblclick = function (e) {
          e.preventDefault();
          lastMouse.x = e.clientX; lastMouse.y = e.clientY;
          openTabMenu(t);
        };
        el.addEventListener('dragstart', function (e) {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', t.id);
        });
        el.addEventListener('dragover', function (e) { e.preventDefault(); });
        el.addEventListener('drop', function (e) {
          e.preventDefault();
          var from = e.dataTransfer.getData('text/plain');
          if (from && from !== t.id) act('tabs.reorder', { tabId: from, beforeTabId: t.id });
        });
        return el;
      }
      function renderTabs() {
        var tabs = state.tabs || [];
        var active = state.activeTabId || '';
        var split = state.split || null;
        applySplitClass();
        var changed = tabsEl.dataset.active !== active || tabsEl.dataset.split !== String(split ? split[1] : '');
        tabsEl.dataset.active = active;
        tabsEl.dataset.split = String(split ? split[1] : '');
        tabsEl.textContent = '';
        if (tabs.length === 0) {
          tabsEl.style.display = 'none';
        } else {
          tabsEl.style.display = 'flex';
          if (split) {
            // VS Code-style split: each pane's tab chip sits above ITS OWN
            // content, and the two segments size with the split ratio so the
            // chips line up over their engine views.
            var slotW = document.getElementById('page-slot').getBoundingClientRect().width;
            var r = Math.min(0.8, Math.max(0.2, state.splitRatio || 0.5));
            var segA = document.createElement('div');
            segA.className = 'tab-seg';
            segA.style.flex = '0 0 ' + (r * 100).toFixed(2) + '%';
            var leftTab = tabs.find(function (t) { return t.id === split[0]; });
            if (leftTab) segA.appendChild(makeChip(leftTab, split));
            var segB = document.createElement('div');
            segB.className = 'tab-seg';
            segB.style.flex = '1 1 0%';
            var rightTab = tabs.find(function (t) { return t.id === split[1]; });
            if (rightTab) segB.appendChild(makeChip(rightTab, split));
            tabsEl.appendChild(segA);
            tabsEl.appendChild(segB);
          } else {
            for (var i = 0; i < tabs.length; i++) {
              (function (t) {
                var el = document.createElement('div');
                el.className = 'tab' + (t.id === active ? ' on' : '');
                el.draggable = true;
                el.dataset.tabId = t.id;
                var label = document.createElement('span');
                label.textContent = t.title || shortUrl(t.url) || '新标签页';
                el.title = t.url || '';
                if (t.evicted) label.textContent += ' (重新打开会重载)';
                el.appendChild(label);
                var x = document.createElement('button');
                x.className = 'x';
                x.textContent = '×';
                x.setAttribute('aria-label', '关闭标签页');
                x.onclick = function (e) { e.stopPropagation(); act('tabs.close', { tabId: t.id }); };
                el.appendChild(x);
                el.onclick = function () { act('tabs.activate', { tabId: t.id }); };
                el.oncontextmenu = function (e) {
                  e.preventDefault();
                  e.stopPropagation();
                  lastMouse.x = e.clientX; lastMouse.y = e.clientY;
                  openTabMenu(t);
                };
                el.ondblclick = function (e) {
                  e.preventDefault();
                  lastMouse.x = e.clientX; lastMouse.y = e.clientY;
                  openTabMenu(t);
                };
                el.addEventListener('dragstart', function (e) {
                  e.dataTransfer.effectAllowed = 'move';
                  e.dataTransfer.setData('text/plain', t.id);
                });
                el.addEventListener('dragover', function (e) { e.preventDefault(); });
                el.addEventListener('drop', function (e) {
                  e.preventDefault();
                  var from = e.dataTransfer.getData('text/plain');
                  if (from && from !== t.id) act('tabs.reorder', { tabId: from, beforeTabId: t.id });
                });
                tabsEl.appendChild(el);
              })(tabs[i]);
            }
          }
          var plus = document.createElement('button');
          plus.className = 'newtab';
          plus.textContent = '+';
          plus.title = '新建标签页';
          plus.setAttribute('aria-label', '新建标签页');
          plus.onclick = function () { act('tabs.new', {}); };
          tabsEl.appendChild(plus);
        }
        // Focus or split changed → the engine views must follow.
        if (changed && slotHandle && slotHandle.refresh) slotHandle.refresh();
        if (slotBHandle && slotBHandle.refresh) slotBHandle.refresh();
      }
      function shortUrl(u) {
        try {
          var s = String(u || '').replace(/^https?:\/\//i, '');
          return s.split('/')[0] + (s.split('/')[1] ? '/' + s.split('/')[1] : '');
        } catch (e) { return String(u || ''); }
      }

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      // ── Panel state ──
      var state = {
        url: '',
        title: '',
        favorited: false,
        private: false,
        selPopup: true,
        favorites: [],   // last omnibox.search answer
        history: [],
        recipes: [],     // recorded operations for the CURRENT site
        recipeSite: '',  // registrable domain those recipes belong to
        recipeOrigin: '',
        collections: [], // deterministic reading recipes for the CURRENT site
        collectView: null, // {id, busy, result, error} while running/showing one
        memory: [],      // long-term notes the user wrote for the CURRENT site
        memorySite: '',
        memoryOrigin: '',
        memoryFavorited: false, // whether those notes are injected on navigation
        runs: [],        // recent browser_act runs for the CURRENT site
        memEditId: '',   // note being edited inline
        memHistoryId: '', // note whose revisions are open
        memDraft: '',    // add-field text, kept across re-renders
        memError: '',    // last write failure, shown under the section
        editing: null,   // recipe being edited in the dropdown
        recipeHistoryId: '', // recipe whose revisions are open
        running: null,   // recipe being test-run (executes for real)
        active: -1,      // highlighted row across both sections
        tabs: [],        // this conversation's tabs (mirror of the backend)
        activeTabId: '',
        engineTabId: '', // the engine tab THIS host tab shows
        split: null,     // [leftTabId, rightTabId] while the panes are split
        splitRatio: 0.5  // the panes' width share (primary's fraction)
      };
      var searchSeq = 0;

      function displayUrl(u) {
        return String(u || '').replace(/^https?:\/\//i, '');
      }

      function flatItems() {
        return state.favorites.concat(state.history);
      }

      function isRecordable(u) {
        return /^https?:\/\//i.test(String(u || ''));
      }

      /**
       * What to search for. The address bar holds the current page's URL, so
       * taking it at face value would filter the list down to nothing the
       * moment you click the bar — the launcher (favorites + recent) is what
       * an untouched bar should show. Only text the user actually typed
       * counts as a query.
       */
      function queryOf() {
        var value = input.value.trim();
        if (!value || value === state.url) return '';
        return value;
      }

      function updateStar() {
        var usable = isRecordable(state.url);
        btnStar.disabled = !usable;
        // Filled/outline is driven by the `.on` class on the SVG; writing
        // textContent here would erase the icon.
        btnStar.classList.toggle('on', state.favorited);
        btnStar.setAttribute('aria-pressed', state.favorited ? 'true' : 'false');
        btnStar.title = state.favorited
          ? '取消收藏（本站已记录的快捷方式会保留，可在地址栏删除）'
          : '收藏此页（收藏后本站重复的操作会记成快捷方式）';
      }

      // ── New-tab page (favorites) ──
      // The host tab with no page is not blank: it shows the favorites grid.
      // The engine view is a native layer, so it must be hidden while this
      // DOM page is up — #page-slot[hidden] makes the live slot report 0×0.
      var ntSeq = 0;
      function syncNewTab() {
        var empty = !state.url || /^about:blank/i.test(state.url);
        newtab.hidden = !empty;
        pageSlot.hidden = empty;
        // Always force a report: hiding the parent changes the slot to 0×0,
        // and the engine view must be told to hide even when the observer's
        // batch lands after the first paint.
        if (slotHandle && slotHandle.refresh) slotHandle.refresh();
        if (!empty) return;
        renderNewTab();
      }
      function renderNewTab() {
        var seq = ++ntSeq;
        window.piSDK.request('omnibox.search', { query: '' }).then(function (res) {
          if (seq !== ntSeq) return;
          var favs = (res && res.favorites) || [];
          ntFavs.textContent = '';
          ntEmpty.hidden = favs.length > 0;
          for (var i = 0; i < favs.length; i++) {
            (function (f) {
              var card = document.createElement('button');
              card.type = 'button';
              card.className = 'nt-card';
              card.title = f.url || '';
              var title = document.createElement('span');
              title.className = 'nt-title';
              title.textContent = f.title || displayUrl(f.url);
              var url = document.createElement('span');
              url.className = 'nt-url';
              url.textContent = displayUrl(f.url);
              card.appendChild(title);
              card.appendChild(url);
              card.addEventListener('click', function () {
                input.value = f.url;
                state.url = f.url;
                act('nav.open', { url: f.url });
              });
              ntFavs.appendChild(card);
            })(favs[i]);
          }
        }).catch(function () {});
      }

      // ── Omnibox ──
      function openOmnibox() {
        if (omnibox.hidden) {
          omnibox.hidden = false;
          refreshList();
        }
      }

      function closeOmnibox() {
        omnibox.hidden = true;
        state.active = -1;
        // A test run is a VIEW inside the dropdown, not a mode: closing the
        // dropdown ends it. Leaving it behind replaced the list with the old
        // run report the next time the address bar was clicked — favorites and
        // history looked "gone". The recipe's health is already saved.
        state.running = null;
        state.recipeHistoryId = '';
        state.collectView = null;
        disarmClear();
      }

      function refreshList() {
        var seq = ++searchSeq;
        var pending = window.piSDK.request('omnibox.search', { query: queryOf() })
          .then(function (res) {
            if (seq !== searchSeq) return;  // a newer keystroke already answered
            state.favorites = (res && res.favorites) || [];
            state.history = (res && res.history) || [];
            // Keep the highlight where it was (clamped) rather than clearing
            // it: the answer is one IPC round-trip behind the keystroke that
            // asked for it, and ArrowDown on a closed omnibox asks for a
            // highlight before the rows it points at exist.
            state.active = Math.max(-1, Math.min(state.active, flatItems().length - 1));
            renderList();
            setActive(state.active);
          })
          .catch(function () {});
        // Recipes belong to the site on screen, so they are fetched alongside
        // and filtered here — the omnibox query itself is about addresses.
        window.piSDK.request('recipes.list', { url: state.url })
          .then(function (rr) {
            if (seq !== searchSeq) return;
            state.recipes = (rr && rr.recipes) || [];
            state.recipeSite = (rr && rr.site) || '';
            state.recipeOrigin = (rr && rr.origin) || '';
            renderList();
          })
          .catch(function () {});
        // Site memory is the user's own writing for this site; like recipes it
        // is keyed to the page on screen, not to the address query.
        window.piSDK.request('siteMemory.list', { url: state.url })
          .then(function (mr) {
            if (seq !== searchSeq) return;
            state.memory = (mr && mr.notes) || [];
            state.memorySite = (mr && mr.site) || '';
            state.memoryOrigin = (mr && mr.origin) || '';
            state.memoryFavorited = !!(mr && mr.favorited);
            renderList();
          })
          .catch(function () {});
        // The run ledger is what makes a failure explainable, so it loads with
        // the notes rather than behind another click.
        window.piSDK.request('siteMemory.runs', { url: state.url })
          .then(function (rr) {
            if (seq !== searchSeq) return;
            state.runs = (rr && rr.runs) || [];
            renderList();
          })
          .catch(function () {});
        // Deterministic reading recipes for the site on screen.
        window.piSDK.request('collections.list', { url: state.url })
          .then(function (cr) {
            if (seq !== searchSeq) return;
            state.collections = (cr && cr.collections) || [];
            renderList();
          })
          .catch(function () {});
        return pending;
      }

      /** alt(a || b || c) → "a …" — the fallbacks are noise in a preview. */
      function prettyTarget(t) {
        var m = /^alt\(([\s\S]*)\)$/.exec(String(t || ''));
        if (!m) return String(t || '');
        var parts = m[1].split('||').map(function (s) { return s.trim(); }).filter(Boolean);
        if (parts.length <= 1) return parts[0] || String(t || '');
        return parts[0] + ' …';
      }

      /**
       * The test-run view. It shows the steps BEFORE running them, because
       * this really executes: a recipe that posts or orders would do exactly
       * that. Parameters and file paths are the only things the user supplies.
       */
      function runHtml() {
        var rn = state.running;
        var rec = rn.snapshot || null;
        var i;
        for (i = 0; i < state.recipes.length; i++) {
          if (state.recipes[i].id === rn.id) { rec = state.recipes[i]; break; }
        }
        if (!rec) {
          // Deleted in another panel while this view was open: say so, and
          // leave a way back to the list.
          return (
            '<div class="sec">运行配方</div>' +
            '<div class="empty">这条配方已经不在了</div>' +
            '<div class="re-actions"><button class="run-cancel">关闭</button></div>'
          );
        }

        var bad = rec.lastError ? rec.lastError.step : 0;
        var steps = '';
        var tokens = [];
        for (i = 0; i < rec.steps.length; i++) {
          var st = rec.steps[i];
          var found = String(st.value || '').match(/\{\{\d+\}\}/g) || [];
          for (var k = 0; k < found.length; k++) {
            if (tokens.indexOf(found[k]) === -1) tokens.push(found[k]);
          }
          steps +=
            '<div class="run-step' + (bad === i + 1 ? ' bad' : '') + '">' +
              '<span class="re-kind">' + esc(st.kind) + '</span>' +
              '<span class="run-t">' + esc(prettyTarget(st.target)) + '</span>' +
              (st.kind === 'upload'
                ? '<input class="run-file" data-step="' + i + '" placeholder="本地文件绝对路径" value="' +
                    esc(rn.values['file:' + i] || '') + '">'
                : '') +
            '</div>';
        }

        var params = '';
        for (i = 0; i < tokens.length; i++) {
          params +=
            '<label class="re-name-label">参数 ' + esc(tokens[i].replace(/[{}]/g, '')) +
              '<input class="run-val" data-token="' + esc(tokens[i]) + '" value="' +
                esc(rn.values[tokens[i]] || '') + '">' +
            '</label>';
        }

        var out = '';
        if (rn.busy) {
          out = '<div class="run-head">正在运行…</div>';
        } else if (rn.done) {
          if (rn.failedStep) {
            out += '<div class="run-head bad">第 ' + rn.failedStep + ' 步失败：' + esc(rn.error || '') + '</div>';
          } else if (rn.error) {
            out += '<div class="run-head bad">' + esc(rn.error) + '</div>';
          } else {
            out += '<div class="run-head">✓ 跑完了 ' + rn.log.length + ' 步</div>';
          }
          for (i = 0; i < rn.log.length; i++) out += '<div class="line">' + esc(rn.log[i]) + '</div>';
          for (i = 0; i < rn.gaps.length; i++) out += '<div class="line">⚠ ' + esc(rn.gaps[i]) + '</div>';
          out = '<div class="run-out">' + out + '</div>';
        }

        return (
          '<div class="sec">运行配方</div>' +
          '<div class="recipe-run" data-id="' + esc(rec.id) + '">' +
            '<div class="run-title">' + esc(rec.name) + ' · ' + rec.steps.length + ' 步</div>' +
            '<div class="run-tip">会真的执行每一步——发消息、提交表单、下单这类操作会真的发生。</div>' +
            '<div class="run-steps">' + steps + '</div>' +
            params +
            '<div class="re-actions">' +
              '<button class="re-save run-go"' + (rn.busy ? ' disabled' : '') + '>' +
                (rn.done ? '再运行' : '运行') +
              '</button>' +
              '<button class="run-cancel">' + (rn.done ? '关闭' : '取消') + '</button>' +
            '</div>' +
            out +
          '</div>'
        );
      }

      /**
       * The collection result view. Data, not navigation: it shows only the
       * fields the recipe asked for, because that is all the runner returned.
       */
      function collectHtml() {
        var cv = state.collectView;
        var col = state.collections.filter(function (c) { return c.id === cv.id; })[0] || null;
        var head = '<div class="sec">🧲 采集' + (col ? ' · ' + esc(col.name) : '') + '</div>';
        if (cv.busy) {
          return head +
            '<div class="recipe-run"><div class="run-head">正在运行：会真实打开页面并只读取字段…</div>' +
            '<div class="re-actions"><button class="collect-close">关闭</button></div></div>';
        }
        var out = '<div class="recipe-run">';
        if (cv.error) {
          out += '<div class="run-head bad">' + esc(cv.error) + '</div>';
        } else {
          var res = cv.result || {};
          var items = res.list || [];
          out += '<div class="run-head">✓ ' + items.length + ' 条 · ' +
            ((res.ms || 0) / 1000).toFixed(1) + 's（只返回字段，没有页面快照）</div>';
          out += '<div class="run-out">';
          for (var i = 0; i < items.length; i++) {
            var parts = [];
            for (var k in items[i]) {
              if (!Object.prototype.hasOwnProperty.call(items[i], k)) continue;
              var v = String(items[i][k] || '');
              if (v) parts.push(k + ': ' + (v.length > 120 ? v.slice(0, 120) + '…' : v));
            }
            out += '<div class="line">' + (i + 1) + '. ' + esc(parts.join(' · ')) + '</div>';
          }
          var details = res.details || [];
          if (details.length) {
            out += '<div class="line" style="margin-top:6px">详情：</div>';
            for (var d = 0; d < details.length; d++) {
              out += '<div class="line">- ' + esc(details[d].url || '') + '</div>';
              var fields = details[d].fields || {};
              for (var fk in fields) {
                if (!Object.prototype.hasOwnProperty.call(fields, fk)) continue;
                var fv = String(fields[fk] || '');
                if (fv) {
                  out += '<div class="line">&nbsp;&nbsp;' + esc(fk) + ': ' +
                    esc(fv.length > 200 ? fv.slice(0, 200) + '…' : fv) + '</div>';
                }
              }
            }
          }
          out += '</div>';
        }
        out += '<div class="re-actions"><button class="collect-close">关闭</button></div></div>';
        return head + out;
      }

      function renderList() {
        var rows = [];
        var i;

        // A collection run takes over the dropdown: it is a read with a result,
        // not a navigation list.
        if (state.collectView) {
          rows.push(collectHtml());
          list.innerHTML = rows.join('');
          return;
        }
        // Recipe revision history replaces the list, like the editor does: a
        // manual selector fix is exactly the change people need to undo.
        if (state.recipeHistoryId) {
          var histRec = state.recipes.filter(function (r) { return r.id === state.recipeHistoryId; })[0] || null;
          rows.push('<div class="sec">配方修订历史' + (histRec ? ' · ' + esc(histRec.name) : '') + '</div>');
          if (!histRec) {
            rows.push('<div class="empty">这条配方已经不在了</div>');
          } else {
            var histRevs = (histRec.revisions || []).slice().reverse();
            if (!histRevs.length) {
              rows.push('<div class="empty">还没有历史记录——手动编辑配方后才会留下</div>');
            }
            for (i = 0; i < histRevs.length; i++) {
              var hrev = histRevs[i];
              rows.push(
                '<div class="hist-row">' +
                  '<span class="hist-when">' + esc(whenLabel(hrev.at)) + '</span>' +
                  '<span class="hist-meta">' + esc(hrev.name || '（无名称）') + ' · ' + hrev.steps.length + ' 步</span>' +
                  '<button class="row-x" data-recipe-restore="' + hrev.at + '" title="恢复到这一版">↺</button>' +
                '</div>'
              );
            }
          }
          rows.push('<div class="re-actions"><button class="hist-close">关闭</button></div>');
          list.innerHTML = rows.join('');
          return;
        }

        // Editing replaces the list: selectors are text, and a text field is
        // the honest editor for them.
        if (state.editing) {
          var ed = state.editing;
          rows.push('<div class="sec">编辑配方</div>');
          // Say WHY it broke, not just that it did: a red banner naming the
          // step is the difference between fixing it and guessing.
          if (ed.lastError) {
            rows.push(
              '<div class="re-warn">上次运行在第 ' + ed.lastError.step + ' 步失败：' +
                esc(ed.lastError.message || '（没有记录原因）') +
              '</div>'
            );
          }
          var stepHtml = '';
          for (i = 0; i < ed.steps.length; i++) {
            var st = ed.steps[i];
            var hasValue = st.kind === 'fill' || st.kind === 'select';
            var bad = ed.lastError && ed.lastError.step === i + 1;
            stepHtml +=
              '<div class="re-step' + (bad ? ' bad' : '') + '" data-kind="' + esc(st.kind) + '">' +
                '<span class="re-kind">' + esc(st.kind) + '</span>' +
                '<input class="re-target" value="' + esc(st.target) + '" placeholder="目标: #id / [name=…] / role=… / text=…">' +
                (hasValue ? '<input class="re-value" value="' + esc(st.value || '') + '" placeholder="值，如 {{1}}">' : '') +
                '<input class="re-expect" value="' + esc(st.expect || '') + '" placeholder="预期（可空）">' +
              '</div>';
          }
          rows.push(
            '<div class="recipe-edit" data-id="' + esc(ed.id) + '">' +
              '<label class="re-name-label">名称<input class="re-name" value="' + esc(ed.name) + '"></label>' +
              '<div class="re-steps">' + stepHtml + '</div>' +
              '<div class="re-actions"><button class="re-save">保存</button><button class="re-cancel">取消</button></div>' +
            '</div>'
          );
          list.innerHTML = rows.join('');
          return;
        }

        // A test run is the same steps the agent would run, executed by the
        // user's hand: it shows the steps before running (they really happen)
        // and reports each one afterwards.
        if (state.running) {
          rows.push(runHtml());
          list.innerHTML = rows.join('');
          return;
        }

        if (state.favorites.length) {
          rows.push('<div class="sec">★ 收藏</div>');
          for (i = 0; i < state.favorites.length; i++) {
            rows.push(rowHtml(state.favorites[i], i, true));
          }
        }
        // ── Site memory: what the user taught us about this site ──
        // Shown once the site is favorited (an empty slate to write into) or
        // when notes already exist (including after unfavoriting, where they
        // stay but are no longer injected).
        if (state.memory.length || (state.favorited && state.memoryOrigin)) {
          rows.push('<div class="sec">🧠 本站记忆' + (state.memorySite ? ' · ' + esc(state.memorySite) : '') + '</div>');
          var suspectNotes = state.memory.filter(function (n) { return !!n.suspect; });
          var pendingNotes = state.memory.filter(function (n) { return !n.suspect && n.verified === false; });
          var confirmedNotes = state.memory.filter(function (n) { return !n.suspect && n.verified !== false; });
          // Suspect first: the page has already contradicted these, so they are
          // paused and are the only rows with a correctness problem.
          if (suspectNotes.length) {
            rows.push('<div class="sec mem-sub-sec">可疑 · ' + suspectNotes.length + ' · AI 报告与页面不符，已暂停提供</div>');
            for (i = 0; i < suspectNotes.length; i++) {
              (function (sn) {
                rows.push(
                  '<div class="mem-row suspect">' +
                    '<div class="mem-main">' +
                      '<div class="mem-text">' + esc(sn.text) + '</div>' +
                      '<div class="mem-reason">AI 报告：' + esc(sn.suspect.reason) + '</div>' +
                    '</div>' +
                    '<button class="row-x" data-mem-resolve="' + esc(sn.id) + '" title="我核对过页面，这条仍然正确：恢复并提供">✓</button>' +
                    '<button class="row-x" data-mem-del="' + esc(sn.id) + '" title="删除这条记忆">✕</button>' +
                  '</div>'
                );
              })(suspectNotes[i]);
            }
          }
          // Pending next: an unconfirmed AI observation needs the user's hand.
          if (pendingNotes.length) {
            rows.push('<div class="sec mem-sub-sec">待确认 · ' + pendingNotes.length + ' · AI 观察到的事实，确认后才会当作你写的</div>');
            for (i = 0; i < pendingNotes.length; i++) {
              (function (pn) {
                rows.push(
                  '<div class="mem-row">' +
                    '<div class="mem-main">' +
                      '<div class="mem-text">' + esc(pn.text) + '</div>' +
                      '<div class="mem-sub">AI 观察 · 未确认</div>' +
                    '</div>' +
                    '<button class="row-x" data-mem-confirm="' + esc(pn.id) + '" title="确认这条：以后当作用户知识">✓</button>' +
                    '<button class="row-x" data-mem-del="' + esc(pn.id) + '" title="丢弃这条 AI 记录">✕</button>' +
                  '</div>'
                );
              })(pendingNotes[i]);
            }
          }
          if (confirmedNotes.length) {
            if (suspectNotes.length || pendingNotes.length) {
              rows.push('<div class="sec mem-sub-sec">已确认 · ' + confirmedNotes.length + '</div>');
            }
            for (i = 0; i < confirmedNotes.length; i++) {
              var note = confirmedNotes[i];
              if (state.memHistoryId === note.id) {
                var revs = (note.revisions || []).slice().reverse();
                var hist =
                  '<div class="mem-history" data-mem-hist-id="' + esc(note.id) + '">' +
                    '<div class="mem-hist-title">修订历史 · ' + esc(note.text.slice(0, 24)) + '</div>';
                if (!revs.length) hist += '<div class="mem-hist-empty">还没有历史记录</div>';
                for (var h = 0; h < revs.length; h++) {
                  var rev = revs[h];
                  hist +=
                    '<div class="mem-hist-row">' +
                      '<span class="mem-hist-when">' + esc(whenLabel(rev.at)) + '</span>' +
                      '<span class="mem-hist-by">' + (rev.by === 'agent' ? 'AI' : '你') + '</span>' +
                      '<span class="mem-hist-text">' + esc(rev.text) + '</span>' +
                      '<button class="row-x" data-mem-restore="' + rev.at + '" title="恢复到这一版">↺</button>' +
                    '</div>';
                }
                hist += '<div class="re-actions"><button class="mem-hist-close">关闭</button></div></div>';
                rows.push(hist);
                continue;
              }
              if (state.memEditId === note.id) {
                rows.push(
                  '<div class="mem-add" data-mem-edit-id="' + esc(note.id) + '">' +
                    '<input class="mem-input mem-edit-input" value="' + esc(note.text) + '">' +
                    '<button class="mem-edit-save">保存</button>' +
                    '<button class="mem-cancel">取消</button>' +
                  '</div>'
                );
                continue;
              }
              var off = note.enabled === false;
              rows.push(
                '<div class="mem-row' + (off ? ' off' : '') + '">' +
                  '<div class="mem-main">' +
                    '<div class="mem-text">' + esc(note.text) + '</div>' +
                    '<div class="mem-sub">' + (note.by === 'agent' ? 'AI 记的' : '你记的') + (off ? ' · 已停用' : '') + '</div>' +
                  '</div>' +
                  '<button class="row-x" data-mem-toggle="' + esc(note.id) + '" title="' +
                    (off ? '启用：AI 打开本站时会看到' : '停用：暂时不再提供给 AI') + '">' +
                    (off ? '▶' : '⏸') +
                  '</button>' +
                  '<button class="row-x" data-mem-history="' + esc(note.id) + '" title="修订历史（可恢复）">↺</button>' +
                  '<button class="row-x" data-mem-edit="' + esc(note.id) + '" title="编辑">✎</button>' +
                  '<button class="row-x" data-mem-del="' + esc(note.id) + '" title="删除">✕</button>' +
                '</div>'
              );
            }
          }
          rows.push(
            '<div class="mem-add">' +
              '<input class="mem-input" value="' + esc(state.memDraft) + '" ' +
                'placeholder="这个站是干什么的？例如：公司电商后台，常导出订单">' +
              '<button class="mem-add-btn"' + (state.memory.length >= 40 ? ' disabled' : '') + '>记住</button>' +
            '</div>'
          );
          rows.push(
            '<div class="recipe-note">' +
              (state.memoryFavorited
                ? 'AI 打开本站时会先看到这些记忆，并知道这是记忆、不是实时页面。'
                : '本站还没收藏：记忆先存着，收藏后才会提供给 AI。') +
            '</div>'
          );
          if (state.memError) rows.push('<div class="mem-err">' + esc(state.memError) + '</div>');
        }
        // ── Failure ledger ──
        // What broke, and which notes were in front of the agent when it did.
        // The list is context for the user to judge, not an automatic verdict.
        var failedRuns = state.runs.filter(function (r) { return !r.ok; }).slice(0, 3);
        if (failedRuns.length) {
          rows.push('<div class="sec">⚠ 最近的失败 · ' + (state.memorySite ? esc(state.memorySite) : '本站') + '</div>');
          for (i = 0; i < failedRuns.length; i++) {
            (function (run) {
              var used = (run.injected || []).map(function (id) {
                var hit = state.memory.filter(function (n) { return n.id === id; })[0];
                return hit ? hit.text : id;
              }).slice(0, 2).join('、');
              rows.push(
                '<div class="run-fail">' +
                  '<div class="rf-where">第 ' + run.failedStep + ' 步失败：' + esc(run.error || '（没有记录原因）') + '</div>' +
                  '<div class="rf-meta">' + esc(whenLabel(run.at)) +
                    (run.recipeName ? ' · 配方「' + esc(run.recipeName) + '」' : ' · 临时操作') + '</div>' +
                  '<div class="rf-meta">' + (used ? '当时带着记忆：' + esc(used) : '当时没有注入记忆') + '</div>' +
                '</div>'
              );
            })(failedRuns[i]);
          }
        }
        if (state.history.length) {
          rows.push('<div class="sec">最近访问</div>');
          for (i = 0; i < state.history.length; i++) {
            rows.push(rowHtml(state.history[i], state.favorites.length + i, false));
          }
        }
        if (state.recipes.length) {
          rows.push('<div class="sec">⚡ ' + esc(state.recipeSite || '本站') + ' 配方</div>');
          for (i = 0; i < state.recipes.length; i++) {
            var rec = state.recipes[i];
            var stale = rec.failures >= 2 ? ' · 已失效' : '';
            // Where it broke last time — a stale row that says "第 2 步失败"
            // is actionable; "已失效" alone sends the user into the editor blind.
            var broke = rec.lastError ? ' · 上次第 ' + rec.lastError.step + ' 步失败' : '';
            var host = rec.origin !== state.recipeOrigin ? esc(rec.origin.replace(/^https?:\/\//, '')) + ' · ' : '';
            rows.push(
              '<div class="recipe-row">' +
                '<div class="row-main">' +
                  '<div class="row-title">' + esc(rec.name) + '</div>' +
                  '<div class="row-url">' + host + rec.steps.length + ' 步 · 用过 ' + rec.uses + ' 次' + broke + stale + '</div>' +
                '</div>' +
                '<button class="row-x" data-run="' + esc(rec.id) + '" title="运行这条配方（真的执行每一步）">▶</button>' +
                '<button class="row-x" data-recipe-history="' + esc(rec.id) + '" title="修订历史（可恢复）">↺</button>' +
                '<button class="row-x" data-edit="' + esc(rec.id) + '" title="编辑这条配方">✎</button>' +
                '<button class="row-x" data-recipe="' + esc(rec.id) + '" title="删除这条配方">✕</button>' +
              '</div>'
            );
          }
        }
        // Deterministic reading recipes: run returns fields, not a page.
        if (state.collections.length) {
          rows.push('<div class="sec">🧲 采集</div>');
          for (i = 0; i < state.collections.length; i++) {
            var col = state.collections[i];
            var stale = col.failures >= 2 ? ' · 已失效' : '';
            var broke = col.lastError ? ' · 上次失败' : '';
            var spec = '列表取 ' + col.list.fields.map(function (f) { return f.key; }).join('/');
            if (col.detail) {
              spec += ' · 进 ' + col.detail.count + ' 条取 ' + col.detail.fields.map(function (f) { return f.key; }).join('/');
            }
            rows.push(
              '<div class="recipe-row">' +
                '<div class="row-main">' +
                  '<div class="row-title">' + esc(col.name) + '</div>' +
                  '<div class="row-url">' + esc(spec) + stale + broke +
                    (col.lastOk ? ' · 上次成功 ' + esc(whenLabel(col.lastOk)) : '') + '</div>' +
                '</div>' +
                '<button class="row-x" data-collect-run="' + esc(col.id) + '" title="运行采集：真实打开页面，只返回字段（不调用模型）">▶</button>' +
                '<button class="row-x" data-collect-del="' + esc(col.id) + '" title="删除这条采集配方">✕</button>' +
              '</div>'
            );
          }
        }
        // Consent is shown where the recipes appear: this is what favoriting
        // turned on, and where it can be undone.
        if (state.favorited) {
          rows.push('<div class="recipe-note">已收藏本站：成功完成的操作会自动记成快捷方式，条目可在上方删除。</div>');
        }
        if (!rows.length) {
          rows.push('<div class="empty">' +
            (queryOf()
              ? '没有匹配的收藏或历史记录'
              : '收藏和历史记录会出现在这里') +
            '</div>');
        }
        list.innerHTML = rows.join('');
      }

      function rowHtml(item, index, isFav) {
        var title = item.title || displayUrl(item.url);
        var side = isFav ? '' : '<span class="row-side">' + esc(whenLabel(item.lastVisitedAt)) + '</span>';
        var x = isFav ? '<button class="row-x" data-remove="' + index + '" title="取消收藏">✕</button>' : '';
        return (
          '<div class="row" data-open="' + index + '">' +
            '<div class="row-main">' +
              '<div class="row-title">' + esc(title) + '</div>' +
              '<div class="row-url">' + esc(displayUrl(item.url)) + '</div>' +
            '</div>' +
            side + x +
          '</div>'
        );
      }

      function whenLabel(ts) {
        var d = new Date(ts || 0);
        if (isNaN(d.getTime())) return '';
        var now = new Date();
        var sameDay = function (a, b) {
          return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
        };
        var hm = function (x) {
          return ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2);
        };
        if (sameDay(d, now)) return '今天 ' + hm(d);
        var y = new Date(now); y.setDate(y.getDate() - 1);
        if (sameDay(d, y)) return '昨天 ' + hm(d);
        return (d.getMonth() + 1) + '月' + d.getDate() + '日';
      }

      function setActive(i) {
        var items = flatItems();
        state.active = Math.max(-1, Math.min(i, items.length - 1));
        var rows = list.querySelectorAll('.row');
        for (var k = 0; k < rows.length; k++) {
          rows[k].classList.toggle('active', Number(rows[k].getAttribute('data-open')) === state.active);
        }
        // .sec headers are not .row, so this NodeList lines up with flatItems()
        // one for one — index it directly, no offset for the headers.
        var el = rows.length ? rows[state.active] : null;
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      }

      function choose(item) {
        if (!item || !item.url) return;
        act('nav.open', { url: item.url });
        closeOmnibox();
        input.blur();
      }

      // mousedown inside the dropdown must not move focus, or the input's blur
      // would close the list before the click lands (the classic combobox trap).
      omnibox.addEventListener('mousedown', function (e) {
        // The recipe editor and the test runner hold real inputs — they must
        // be able to take focus.
        if (e.target && e.target.closest && e.target.closest('.recipe-edit, .recipe-run')) return;
        e.preventDefault();
      });

      /**
       * Execute the recipe right here, on the conversation's own tab. The
       * backend refuses when the page is on another site — a recipe is bound
       * to the origin it was recorded on, and #name means other things there.
       */
      function startRun() {
        var rn = state.running;
        if (!rn || rn.busy) return;
        var wrap = list.querySelector('.recipe-run');
        if (wrap) {
          var vals = wrap.querySelectorAll('.run-val');
          var i;
          for (i = 0; i < vals.length; i++) rn.values[vals[i].getAttribute('data-token')] = vals[i].value;
          var files = wrap.querySelectorAll('.run-file');
          for (i = 0; i < files.length; i++) {
            rn.values['file:' + files[i].getAttribute('data-step')] = files[i].value;
          }
        }
        rn.busy = true;
        rn.done = false;
        rn.log = [];
        rn.gaps = [];
        rn.failedStep = 0;
        rn.error = '';
        renderList();
        window.piSDK.request('recipes.run', { id: rn.id, values: rn.values })
          .then(function (res) {
            rn.busy = false;
            rn.done = true;
            rn.log = (res && res.log) || [];
            rn.gaps = (res && res.gaps) || [];
            rn.failedStep = (res && res.failedStep) || 0;
            rn.error = (res && res.error) || '';
            if (res && res.missing) {
              rn.error = '还缺参数：' + res.missing.map(function (m) {
                return String(m).replace(/[{}]/g, '');
              }).join('、');
            }
            // Re-read the list: the run just changed this recipe's health.
            refreshList();
          })
          .catch(function (err) {
            rn.busy = false;
            rn.done = true;
            rn.error = (err && err.message) || String(err);
            renderList();
          });
      }

      // Typing must survive a re-render (the address bar asks for the list on
      // every keystroke and each answer repaints it).
      list.addEventListener('input', function (e) {
        var el = e.target;
        if (!el || !el.classList) return;
        // Site-memory fields are not part of a recipe run; keep the draft so a
        // repaint (a urlChanged push) does not eat what the user typed.
        if (el.classList.contains('mem-input')) {
          if (!el.classList.contains('mem-edit-input')) state.memDraft = el.value;
          return;
        }
        var rn = state.running;
        if (!rn) return;
        if (el.classList.contains('run-val')) rn.values[el.getAttribute('data-token')] = el.value;
        else if (el.classList.contains('run-file')) rn.values['file:' + el.getAttribute('data-step')] = el.value;
      });

      list.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        var el = e.target;
        if (!el || !el.classList) return;
        if (el.classList.contains('mem-edit-input')) {
          e.preventDefault();
          var wrap = list.querySelector('[data-mem-edit-id]');
          if (!wrap) return;
          window.piSDK.request('siteMemory.update', { id: wrap.getAttribute('data-mem-edit-id'), text: el.value })
            .then(function () {
              state.memEditId = '';
              state.memError = '';
              refreshList();
            })
            .catch(memFail);
        } else if (el.classList.contains('mem-input')) {
          e.preventDefault();
          addSiteMemory();
        }
      });

      function memFail(err) {
        state.memError = (err && err.message) || String(err);
        renderList();
      }

      function addSiteMemory() {
        var el = list.querySelector('.mem-add .mem-input:not(.mem-edit-input)');
        var text = (el ? el.value : state.memDraft).trim();
        if (!text) return;
        window.piSDK.request('siteMemory.add', { url: state.url, text: text })
          .then(function () {
            state.memDraft = '';
            state.memError = '';
            refreshList();
          })
          .catch(memFail);
      }

      list.addEventListener('click', function (e) {
        var target = e.target;
        // ── Site memory ──
        var memEditBtn = target.closest ? target.closest('[data-mem-edit]') : null;
        if (memEditBtn) {
          state.memEditId = memEditBtn.getAttribute('data-mem-edit');
          state.memError = '';
          renderList();
          return;
        }
        var memToggleBtn = target.closest ? target.closest('[data-mem-toggle]') : null;
        if (memToggleBtn) {
          var mtId = memToggleBtn.getAttribute('data-mem-toggle');
          var mtNote = state.memory.filter(function (n) { return n.id === mtId; })[0];
          window.piSDK.request('siteMemory.update', {
            id: mtId,
            // An enabled note pauses; a paused one resumes.
            enabled: !!(mtNote && mtNote.enabled === false),
          }).then(refreshList).catch(memFail);
          return;
        }
        var memResolveBtn = target.closest ? target.closest('[data-mem-resolve]') : null;
        if (memResolveBtn) {
          // The user checked the page: the note was right after all.
          window.piSDK.request('siteMemory.resolve', {
            id: memResolveBtn.getAttribute('data-mem-resolve'),
          }).then(refreshList).catch(memFail);
          return;
        }
        var memHistBtn = target.closest ? target.closest('[data-mem-history]') : null;
        if (memHistBtn) {
          state.memHistoryId = memHistBtn.getAttribute('data-mem-history');
          state.memEditId = '';
          renderList();
          return;
        }
        var memRestoreBtn = target.closest ? target.closest('[data-mem-restore]') : null;
        if (memRestoreBtn) {
          state.memError = '';
          window.piSDK.request('siteMemory.restore', {
            id: state.memHistoryId,
            at: Number(memRestoreBtn.getAttribute('data-mem-restore')),
          }).then(function () {
            state.memHistoryId = '';
            refreshList();
          }).catch(memFail);
          return;
        }
        var memHistClose = target.closest ? target.closest('.mem-hist-close') : null;
        if (memHistClose) {
          state.memHistoryId = '';
          renderList();
          return;
        }
        var memConfirmBtn = target.closest ? target.closest('[data-mem-confirm]') : null;
        if (memConfirmBtn) {
          // Confirmation is the user putting their name on the AI's sentence.
          window.piSDK.request('siteMemory.update', {
            id: memConfirmBtn.getAttribute('data-mem-confirm'),
            verified: true,
          }).then(refreshList).catch(memFail);
          return;
        }
        var memDelBtn = target.closest ? target.closest('[data-mem-del]') : null;
        if (memDelBtn) {
          window.piSDK.request('siteMemory.remove', { id: memDelBtn.getAttribute('data-mem-del') })
            .then(refreshList)
            .catch(memFail);
          return;
        }
        var memSaveBtn = target.closest ? target.closest('.mem-edit-save') : null;
        if (memSaveBtn) {
          var memWrap = list.querySelector('[data-mem-edit-id]');
          if (memWrap) {
            window.piSDK.request('siteMemory.update', {
              id: memWrap.getAttribute('data-mem-edit-id'),
              text: memWrap.querySelector('.mem-edit-input').value,
            }).then(function () {
              state.memEditId = '';
              state.memError = '';
              refreshList();
            }).catch(memFail);
          }
          return;
        }
        var memCancelBtn = target.closest ? target.closest('.mem-cancel') : null;
        if (memCancelBtn) {
          state.memEditId = '';
          state.memError = '';
          refreshList();
          return;
        }
        var memAddBtn = target.closest ? target.closest('.mem-add-btn') : null;
        if (memAddBtn) { addSiteMemory(); return; }

        var recHistBtn = target.closest ? target.closest('[data-recipe-history]') : null;
        if (recHistBtn) {
          state.recipeHistoryId = recHistBtn.getAttribute('data-recipe-history');
          state.editing = null;
          state.running = null;
          renderList();
          return;
        }
        var recRestoreBtn = target.closest ? target.closest('[data-recipe-restore]') : null;
        if (recRestoreBtn) {
          act('recipes.restore', {
            id: state.recipeHistoryId,
            at: Number(recRestoreBtn.getAttribute('data-recipe-restore')),
          }).then(function () {
            state.recipeHistoryId = '';
            refreshList();
          }).catch(memFail);
          return;
        }
        var histCloseBtn = target.closest ? target.closest('.hist-close') : null;
        if (histCloseBtn) {
          state.recipeHistoryId = '';
          refreshList();
          return;
        }
        // ── Collection runs ──
        var collectRunBtn = target.closest ? target.closest('[data-collect-run]') : null;
        if (collectRunBtn) {
          var collectId = collectRunBtn.getAttribute('data-collect-run');
          state.collectView = { id: collectId, busy: true, result: null, error: '' };
          renderList();
          act('collections.run', { id: collectId }).then(function (res) {
            state.collectView = {
              id: collectId,
              busy: false,
              result: res || {},
              error: res && res.ok === false ? (res.error || '采集失败') : '',
            };
            refreshList();
          }).catch(function (err) {
            state.collectView = {
              id: collectId,
              busy: false,
              result: null,
              error: (err && err.message) || String(err),
            };
            renderList();
          });
          return;
        }
        var collectDelBtn = target.closest ? target.closest('[data-collect-del]') : null;
        if (collectDelBtn) {
          act('collections.remove', { id: collectDelBtn.getAttribute('data-collect-del') })
            .then(refreshList)
            .catch(memFail);
          return;
        }
        var collectCloseBtn = target.closest ? target.closest('.collect-close') : null;
        if (collectCloseBtn) {
          state.collectView = null;
          refreshList();
          return;
        }

        var eBtn = target.closest ? target.closest('[data-edit]') : null;
        if (eBtn) {
          var edId = eBtn.getAttribute('data-edit');
          state.running = null;
          state.recipeHistoryId = '';
          state.editing = state.recipes.filter(function (r) { return r.id === edId; })[0] || null;
          renderList();
          return;
        }
        // ── Test run ──
        var runBtn = target.closest ? target.closest('[data-run]') : null;
        if (runBtn) {
          var runId = runBtn.getAttribute('data-run');
          var pick = state.recipes.filter(function (r) { return r.id === runId; })[0] || null;
          state.editing = null;
          state.recipeHistoryId = '';
          state.running = {
            id: runId,
            snapshot: pick,
            values: {},
            log: [],
            gaps: [],
            failedStep: 0,
            error: '',
            busy: false,
            done: false,
          };
          renderList();
          return;
        }
        var goBtn = target.closest ? target.closest('.run-go') : null;
        if (goBtn) { startRun(); return; }
        var stopBtn = target.closest ? target.closest('.run-cancel') : null;
        if (stopBtn) { state.running = null; refreshList(); return; }
        var saveBtn = target.closest ? target.closest('.re-save') : null;
        if (saveBtn) {
          var wrap = list.querySelector('.recipe-edit');
          var editedSteps = [];
          if (wrap) {
            var rows = wrap.querySelectorAll('.re-step');
            for (var k = 0; k < rows.length; k++) {
              var row = rows[k];
              var tgt = row.querySelector('.re-target').value.trim();
              if (!tgt) continue;
              var vEl = row.querySelector('.re-value');
              var eEl = row.querySelector('.re-expect');
              editedSteps.push({
                kind: row.getAttribute('data-kind'),
                target: tgt,
                value: vEl ? vEl.value : undefined,
                expect: eEl && eEl.value ? eEl.value : undefined,
              });
            }
            window.piSDK.request('recipes.update', {
              id: wrap.getAttribute('data-id'),
              name: wrap.querySelector('.re-name').value,
              steps: editedSteps,
            }).then(function (res) {
              if (res && res.ok) { state.editing = null; refreshList(); }
            }).catch(function () {});
          }
          return;
        }
        var cancelBtn = target.closest ? target.closest('.re-cancel') : null;
        if (cancelBtn) { state.editing = null; refreshList(); return; }
        var rBtn = target.closest ? target.closest('[data-recipe]') : null;
        if (rBtn) {
          act('recipes.delete', { id: rBtn.getAttribute('data-recipe') }).then(refreshList);
          return;
        }
        var xBtn = target.closest ? target.closest('[data-remove]') : null;
        if (xBtn) {
          var idx = Number(xBtn.getAttribute('data-remove'));
          var item = flatItems()[idx];
          if (item) {
            act('favorites.remove', { url: item.url }).then(refreshList);
          }
          return;
        }
        var row = target.closest ? target.closest('[data-open]') : null;
        if (row) choose(flatItems()[Number(row.getAttribute('data-open'))]);
      });

      // ── Toolbar ──
      btnStar.addEventListener('click', function () {
        if (!isRecordable(state.url)) return;
        // Read the prior state BEFORE the request: the backend broadcasts
        // `ui.urlChanged` with the new `favorited` as part of the same call, so
        // by the time the answer arrives this panel has already been updated.
        var was = state.favorited;
        window.piSDK.request('favorites.toggle', { url: state.url, title: state.title })
          .then(function (res) {
            if (res && typeof res.favorited === 'boolean') {
              state.favorited = res.favorited;
              updateStar();
              // Starring is the consent that turns site memory on. Show where
              // the first line gets written instead of making the user find it.
              // Unstarring only needs the open list repainted: the notes stay.
              if (res.favorited && !was) {
                var wasOpen = !omnibox.hidden;
                openOmnibox();
                if (wasOpen) refreshList();
              } else if (!omnibox.hidden) {
                refreshList();
              }
            }
          })
          .catch(function (e) { console.warn('favorites.toggle', e && e.message ? e.message : e); });
      });

      document.getElementById('btn-back').addEventListener('click', function () { act('nav.back'); });
      document.getElementById('btn-forward').addEventListener('click', function () { act('nav.forward'); });
      document.getElementById('btn-reload').addEventListener('click', function () { act('nav.reload'); });

      // ── Address bar ──
      input.addEventListener('focus', function () {
        openOmnibox();
        // Like a real address bar: the first click selects the URL so typing
        // replaces it; clicking again (already focused, so no second focus
        // event) drops the caret where you clicked, for editing it instead.
        input.select();
      });
      input.addEventListener('input', function () {
        openOmnibox();
        refreshList();
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeOmnibox();
          input.blur();
          return;
        }
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          openOmnibox();
          setActive(state.active + 1);
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          setActive(state.active - 1);
          return;
        }
        if (e.key === 'Enter') {
          var items = flatItems();
          if (state.active >= 0 && state.active < items.length) {
            choose(items[state.active]);
            return;
          }
          var value = input.value.trim();
          if (value) act('nav.open', { url: value });
          closeOmnibox();
          input.blur();
        }
      });
      // Clicking into the page (the native engine view) steals focus without
      // our page hearing a click — window blur is the only signal we get.
      window.addEventListener('blur', closeOmnibox);

      // ── Footer: private mode + selection popup + clear history ──
      chkPrivate.addEventListener('change', function () {
        window.piSDK.request('settings.setPrivate', { private: chkPrivate.checked })
          .then(function (res) {
            state.private = !!(res && res.private);
            chkPrivate.checked = state.private;
          })
          .catch(function () { chkPrivate.checked = state.private; });
      });

      chkSel.addEventListener('change', function () {
        window.piSDK.request('settings.setSelPopup', { on: chkSel.checked })
          .then(function (res) {
            state.selPopup = !!(res && res.selPopup);
            chkSel.checked = state.selPopup;
          })
          .catch(function () { chkSel.checked = state.selPopup; });
      });

      var clearArmed = false;
      var clearTimer = null;
      function disarmClear() {
        clearArmed = false;
        if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }
        btnClear.textContent = '清空历史';
        btnClear.classList.remove('armed');
      }
      btnClear.addEventListener('click', function () {
        if (!clearArmed) {
          // Two-step confirm: no dialogs in a native-view panel, so arm the
          // button instead — one stray click must not erase the history.
          clearArmed = true;
          btnClear.textContent = '确认清空?';
          btnClear.classList.add('armed');
          clearTimer = setTimeout(disarmClear, 3000);
          return;
        }
        disarmClear();
        act('history.clear').then(refreshList);
      });

      // ── Backend pushes ──
      window.piSDK.onMessage(function (msg) {
        if (!msg || !msg.event || !msg.data) return;
        if (msg.event === 'ui.urlChanged') {
          var nextUrl = String(msg.data.url || '');
          // A real navigation means the site changed: a half-typed memory for
          // the previous site must not follow the user to the next one.
          if (nextUrl !== state.url) {
            state.memDraft = '';
            state.memEditId = '';
            state.memHistoryId = '';
            state.memError = '';
          }
          input.value = nextUrl;
          state.url = nextUrl;
          state.title = String(msg.data.title || '');
          state.favorited = msg.data.favorited === true;
          updateStar();
          syncNewTab();
          if (!omnibox.hidden) refreshList();
        } else if (msg.event === 'ui.imt') {
          renderImt(msg.data);
        } else if (msg.event === 'ui.tabs') {
          state.tabs = msg.data.tabs || [];
          state.activeTabId = String(msg.data.activeTabId || '');
          state.engineTabId = String(msg.data.engineTabId || msg.data.activeTabId || '');
          // The host owns tabs and has no split view.
          state.split = null;
          state.splitRatio = 0.5;
          renderTabs();
          syncNewTab();
        } else if (msg.event === 'ui.favoritesChanged' || msg.event === 'ui.historyCleared') {
          if (!omnibox.hidden) refreshList();
          if (!newtab.hidden) renderNewTab();
        } else if (msg.event === 'ui.recipesChanged') {
          // A recipe's health follows every run — the agent's runs included.
          if (!omnibox.hidden) refreshList();
        } else if (msg.event === 'ui.siteMemoryChanged') {
          // An agent write must show up in the panel immediately: the user
          // has to be able to see (and undo) what the AI remembered.
          if (!omnibox.hidden) refreshList();
        } else if (msg.event === 'ui.siteRunsChanged') {
          // A run's failure — or its clearing — changes the ledger.
          if (!omnibox.hidden) refreshList();
        } else if (msg.event === 'ui.collectionsChanged') {
          // Agent-side add/run/remove must show up here without a reload.
          if (!omnibox.hidden) refreshList();
        } else if (msg.event === 'ui.settingsChanged') {
          state.private = msg.data.private === true;
          chkPrivate.checked = state.private;
          state.selPopup = msg.data.selPopup !== false;
          chkSel.checked = state.selPopup;
        }
      });

      // ── Boot: the shared state pull ──
      window.piSDK.request('state.get').then(function (s) {
        if (!s) return;
        input.value = String(s.url || '');
        state.url = String(s.url || '');
        state.title = String(s.title || '');
        state.favorited = s.favorited === true;
        state.private = s.private === true;
        state.selPopup = s.selPopup !== false;
        state.engineTabId = String(s.engineTabId || s.activeTabId || '');
        if (s.tabs) {
          state.tabs = s.tabs;
          state.activeTabId = String(s.activeTabId || '');
          state.split = null;
          state.splitRatio = 0.5;
          applySplitClass();
          renderTabs();
        }
        chkPrivate.checked = state.private;
        chkSel.checked = state.selPopup;
        updateStar();
        syncNewTab();
      }).catch(function () {});
    })();
  </script>
</body>
</html>
