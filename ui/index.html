<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浏览器</title>
  <style>
    /* 主题令牌是宿主注入的 Tailwind 风格 HSL 分量(见 packages/ui 的 panel-relay.tsx,
       内联在 <html> 上,压过这里),所以一切颜色必须写成 hsl(var(--x, <分量兜底>)):
       注入时跟随应用主题,未注入时落到这里的暗色分量。直接 var(--x) 会在注入后失效。 */
    :root {
      --background: 222 19% 7%; --foreground: 220 21% 92%;
      --card: 222 15% 11%;
      --muted-foreground: 217 9% 59%;
      --accent: 221 19% 17%;
      --border: 218 14% 20%; --ring: 218 100% 65%;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: hsl(var(--background, 222 19% 7%));
      color: hsl(var(--foreground, 220 21% 92%));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      overflow: hidden;
    }
    #toolbar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-bottom: 1px solid hsl(var(--border, 218 14% 20%));
      background: hsl(var(--card, 222 15% 11%));
    }
    /* Icon buttons match the host toolbar: 28px hit area, 16px lucide-style
       2px stroke glyphs in currentColor. Text glyphs (← ⟳ ☆) rendered at a
       different optical size and weight than the shell's icons. */
    #toolbar button {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      cursor: pointer;
    }
    #toolbar button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #toolbar button:hover { background: hsl(var(--accent, 221 19% 17%)); }
    #toolbar button:active { transform: scale(0.94); }
    #toolbar button:disabled { opacity: 0.4; cursor: default; }
    #toolbar button:disabled:hover { background: transparent; }
    #btn-star.on { color: hsl(43 90% 62%); }

    /* Whole-page tools: their controls live in a real toolbar row, because a
       DOM dropdown would be covered by the engine view below. The trigger is a
       sparkle, not a language glyph — the row is 翻译 / 朗读 / 解释 / 分析 /
       存正文, and a 文A icon read as "translation only". The caret is its own
       tiny SVG (a text ▾ sat off-centre next to a 2px-stroke icon). */
    /* `#toolbar button` sets width/padding at id+element specificity, so the
       override has to carry an id too or the 28px square wins and the caret
       spills outside the hover pill. */
    #toolbar #btn-imt {
      width: auto;
      padding: 0 6px;
      gap: 1px;
    }
    #btn-imt .imt-caret {
      width: 10px;
      height: 10px;
      stroke-width: 2.5;
      opacity: 0.65;
      transition: transform 0.15s;
    }
    #btn-imt.open .imt-caret { transform: rotate(180deg); }
    #btn-imt.on { background: hsl(var(--accent, 221 19% 17%)); color: hsl(var(--foreground, 210 20% 92%)); }
    #btn-imt.busy { color: hsl(43 90% 62%); }
    /* Second toolbar row: all whole-page tools live here, above the engine
       view, so nothing is ever covered by the page. */
    #imt-row {
      flex: none;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 36px;
      padding: 0 8px;
      border-bottom: 1px solid hsl(var(--border, 218 14% 20%));
      background: hsl(var(--card, 222 15% 11%));
      font-size: 12px;
      overflow: hidden;
    }
    #imt-row[hidden] { display: none; }
    /* The UA's [hidden] rule loses to `.ir-group { display:flex }`; keep hiding explicit. */
    #imt-row [hidden] { display: none !important; }
    #imt-row .ir-group { display: flex; align-items: center; gap: 2px; flex: none; }
    #imt-row button {
      height: 26px;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    #imt-row button:hover { background: hsl(var(--accent, 221 19% 17%)); color: hsl(var(--foreground, 210 20% 92%)); }
    #imt-row button.on { background: hsl(var(--accent, 221 19% 17%)); color: hsl(var(--foreground, 210 20% 92%)); }
    #imt-row button.primary { background: hsl(30 65% 45%); color: #fff; }
    #imt-row button:disabled { opacity: 0.35; cursor: default; }
    #imt-row button:disabled:hover { background: transparent; color: hsl(var(--muted-foreground, 217 9% 59%)); }
    #imt-row .ir-meta { color: hsl(var(--muted-foreground, 217 9% 59%)); padding: 0 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #imt-row .ir-retry { color: hsl(0 65% 65%); border-color: hsl(0 45% 38%); }
    #imt-row .ir-grow { flex: 1; min-width: 0; }
    #imt-row .ir-close { font-size: 15px; line-height: 1; }
    #imt-row .ir-icon { width: 28px; padding: 0; }
    @media (max-width: 560px) {
      #imt-row { gap: 2px; padding: 0 4px; }
      #imt-row .ir-hide-sm { display: none; }
    }
    #btn-star.on svg { fill: currentColor; }
    #url {
      flex: 1;
      min-width: 0;
      height: 28px;
      padding: 0 10px;
      border: 1px solid hsl(var(--border, 218 14% 20%));
      border-radius: 6px;
      background: hsl(var(--background, 222 19% 7%));
      color: hsl(var(--foreground, 220 21% 92%));
      font-size: 12px;
      outline: none;
    }
    #url:focus { border-color: hsl(var(--ring, 218 100% 65%)); }

    /* 下拉列表(收藏 + 历史)必须长在文档流里,不能绝对定位悬浮在页面上:
       引擎视图是宿主进程里的原生 WebContentsView,永远盖在页面 DOM 之上、
       吞掉落在它身上的点击(见 apps/desktop/src/main/plugins/slots.ts)。
       下拉展开时挤占 #page-slot,piSDK.liveSlot 的 ResizeObserver 会上报新
       矩形、把引擎视图挪到下拉下面,露出并让出这块区域的点击。 */
    #omnibox {
      flex: none;
      max-height: min(320px, 45vh);
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid hsl(var(--border, 218 14% 20%));
      background: hsl(var(--card, 222 15% 11%));
      overflow: hidden;
    }
    #omnibox[hidden] { display: none; }
    #omni-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; }
    .sec {
      padding: 5px 12px 3px;
      font-size: 11px;
      letter-spacing: 0.02em;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      user-select: none;
    }
    .row { display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer; }
    .row.active, .row:hover { background: hsl(var(--accent, 221 19% 17%)); }
    .row-main { flex: 1; min-width: 0; }
    .row-title {
      font-size: 12.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-url {
      font-size: 11px;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-side { flex: none; font-size: 11px; color: hsl(var(--muted-foreground, 217 9% 59%)); }
    .row-x {
      flex: none;
      width: 18px; height: 18px;
      border: none; border-radius: 4px;
      background: transparent;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      font-size: 11px; line-height: 1;
      cursor: pointer;
      visibility: hidden;
    }
    .row:hover .row-x, .row.active .row-x { visibility: visible; }
    /* Recipes are a list, not navigation targets: their own class keeps them
       out of the keyboard-highlight indexing (.row → flatItems). */
    .recipe-row { display: flex; align-items: center; gap: 8px; padding: 5px 12px; }
    .recipe-row .row-x { visibility: visible; }
    .recipe-note { padding: 2px 12px 4px; font-size: 11px; color: hsl(var(--muted-foreground, 217 9% 59%)); }
    /* Site memory: the user's own notes for a site. Not `.row` — they are
       records to manage, not navigation targets, so they stay out of the
       keyboard-highlight indexing. */
    .mem-row { display: flex; align-items: center; gap: 8px; padding: 5px 12px; }
    .mem-row .row-x { visibility: visible; }
    .mem-main { flex: 1; min-width: 0; }
    .mem-text { font-size: 12.5px; word-break: break-word; }
    .mem-row.off .mem-text { color: hsl(var(--muted-foreground, 217 9% 59%)); text-decoration: line-through; }
    .mem-sub { font-size: 11px; color: hsl(var(--muted-foreground, 217 9% 59%)); }
    .mem-add { display: flex; gap: 6px; padding: 4px 12px 6px; }
    .mem-input {
      flex: 1; min-width: 0;
      background: transparent; color: inherit; font: inherit; padding: 3px 6px;
      border: 1px solid hsl(var(--border, 218 14% 20%)); border-radius: 4px;
    }
    .mem-add button {
      flex: none; padding: 3px 12px; border-radius: 4px; cursor: pointer;
      border: 1px solid hsl(var(--border, 218 14% 20%)); background: transparent; color: inherit; font: inherit;
    }
    .mem-add button:disabled { opacity: 0.5; cursor: default; }
    .mem-err { padding: 2px 12px 4px; font-size: 11px; color: hsl(var(--destructive, 0 70% 62%)); }
    /* Pending / confirmed are groups inside the memory section, not peers of
       it: indent so the eye reads one section with two piles. */
    .mem-sub-sec { padding-left: 20px; font-size: 10.5px; }
    .mem-reason { font-size: 11px; color: hsl(var(--destructive, 0 70% 62%)); word-break: break-word; }
    .mem-row.suspect .mem-text { color: hsl(var(--destructive, 0 70% 72%)); }
    .mem-history { padding: 4px 12px 10px; }
    .mem-hist-title { font-size: 11px; color: hsl(var(--muted-foreground, 217 9% 59%)); margin-bottom: 4px; }
    .mem-hist-empty { font-size: 11px; color: hsl(var(--muted-foreground, 217 9% 59%)); padding: 2px 0 6px; }
    .mem-hist-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 11px; }
    .mem-hist-when { flex: none; color: hsl(var(--muted-foreground, 217 9% 59%)); }
    .mem-hist-by { flex: none; color: hsl(var(--muted-foreground, 217 9% 59%)); }
    .mem-hist-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mem-hist-row .row-x { visibility: visible; }
    /* Recipe revision rows (the dropdown's own history view). */
    .hist-row { display: flex; align-items: center; gap: 6px; padding: 3px 12px; font-size: 11px; }
    .hist-when { flex: none; color: hsl(var(--muted-foreground, 217 9% 59%)); }
    .hist-meta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-row .row-x { visibility: visible; }
    /* Failure ledger: a report, not a navigable row. */
    .run-fail { padding: 4px 12px 6px; font-size: 11px; }
    .run-fail .rf-where { color: hsl(var(--destructive, 0 70% 62%)); word-break: break-word; }
    .run-fail .rf-meta { color: hsl(var(--muted-foreground, 217 9% 59%)); word-break: break-word; }
    .recipe-edit { padding: 6px 12px 10px; }
    .re-name-label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: hsl(var(--muted-foreground, 217 9% 59%)); margin-bottom: 6px; }
    .re-name, .re-target, .re-value, .re-expect {
      background: transparent; color: inherit; font: inherit; padding: 2px 6px;
      border: 1px solid hsl(var(--border, 218 14% 20%)); border-radius: 4px; min-width: 0;
    }
    .re-name { flex: 1; }
    .re-steps { display: flex; flex-direction: column; gap: 4px; }
    .re-step { display: flex; align-items: center; gap: 6px; }
    .re-kind { width: 44px; flex: none; font-size: 11px; color: hsl(var(--muted-foreground, 217 9% 59%)); }
    .re-target { flex: 2; }
    .re-value, .re-expect { flex: 1; }
    .re-actions { margin-top: 8px; display: flex; gap: 8px; }
    .re-actions button {
      padding: 3px 12px; border-radius: 4px; cursor: pointer;
      border: 1px solid hsl(var(--border, 218 14% 20%)); background: transparent; color: inherit; font: inherit;
    }
    .re-actions .re-save { border-color: hsl(var(--ring, 218 100% 65%)); }
    /* The step that failed last time, marked in place: the user opens the
       editor to FIX one thing, and should not have to guess which. */
    .re-step.bad, .run-step.bad {
      background: hsl(var(--destructive, 0 70% 50%) / 0.12);
      border-radius: 4px;
    }
    .re-warn {
      margin: 2px 0 8px; padding: 4px 8px; border-radius: 4px; font-size: 11px;
      background: hsl(var(--destructive, 0 70% 50%) / 0.12);
      color: hsl(var(--destructive-foreground, 0 70% 72%));
    }
    .recipe-run { padding: 6px 12px 10px; }
    .run-title { font-size: 12px; margin-bottom: 6px; }
    .run-steps { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
    .run-step { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 1px 4px; }
    .run-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .run-val, .run-file {
      background: transparent; color: inherit; font: inherit; padding: 2px 6px;
      border: 1px solid hsl(var(--border, 218 14% 20%)); border-radius: 4px;
    }
    .run-file { margin-left: 6px; flex: 1; }
    .run-val { flex: 1; }
    .run-tip { font-size: 11px; color: hsl(var(--muted-foreground, 217 9% 59%)); margin-bottom: 6px; }
    .run-out { margin-top: 8px; font-size: 11px; display: flex; flex-direction: column; gap: 3px; }
    .run-out .line { color: hsl(var(--muted-foreground, 217 9% 59%)); word-break: break-word; }
    .run-head { font-size: 12px; margin-bottom: 4px; }
    .run-head.bad { color: hsl(var(--destructive, 0 70% 62%)); }
    .row-x:hover { background: hsl(var(--border, 218 14% 20%)); color: hsl(var(--foreground, 220 21% 92%)); }
    .empty {
      padding: 16px 12px;
      font-size: 12px;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      text-align: center;
      user-select: none;
    }
    #omni-foot {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px;
      border-top: 1px solid hsl(var(--border, 218 14% 20%));
    }
    #omni-foot label {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px;
      cursor: pointer; user-select: none;
      white-space: nowrap;
    }
    #chk-private, #chk-sel { accent-color: hsl(var(--ring, 218 100% 65%)); cursor: pointer; }
    #btn-clear {
      margin-left: auto;
      border: none; border-radius: 4px;
      background: transparent;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      font-size: 12px;
      padding: 2px 6px;
      cursor: pointer;
    }
    #btn-clear:hover { background: hsl(var(--accent, 221 19% 17%)); }
    #btn-clear.armed { color: hsl(0 72% 62%); }

    /* The engine view is positioned exactly over this region by the host
       (piSDK.liveSlot). Keep it empty — anything painted here is covered. */
    #page-slot { flex: 1; min-height: 0; }
    /* NON-split mode: the primary slot must FILL the region — an empty div
       here has zero height, and the engine view would be positioned 0×0
       (invisible + swallowed). height:100% inside the block parent. */
    #page-slot-a { display: block; width: 100%; height: 100%; }
    /* Split mode: the region becomes a flex row; pane A takes the remembered
       share (JS writes paneA.style.flex), B fills the rest. */
    body.split #page-slot { display: flex; }
    body.split #page-slot-a { width: auto; height: auto; }
    #page-slot-b { display: none; }
    body.split #page-slot-b { display: block; flex: 1 1 0%; min-width: 0; }
    /* Split view: two panes share the region; the secondary starts hidden so
       its live slot reports 0×0 (degenerate = hidden view) until a split
       engages. The gutter between them is a REAL splitter (drag → the backend
       remembers the ratio per conversation); pane widths come from JS. */
    #page-slot-a, #page-slot-b { min-width: 0; }
    #split-gutter {
      display: none;
      position: relative;
      flex: none;
      width: 12px;
      cursor: col-resize;
      background: transparent;
      touch-action: none;
      outline: none;
    }
    #split-gutter::before {
      content: '';
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 50%;
      width: 1px;
      transform: translateX(-50%);
      border-radius: 2px;
      background: hsl(var(--border, 218 14% 20%));
      transition: width 0.15s, background 0.15s;
    }
    #split-gutter:hover::before, #split-gutter.drag::before {
      width: 3px;
      background: hsl(var(--ring, 218 100% 65%) / 0.7);
    }
    #split-gutter::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 36px;
      transform: translate(-50%, -50%);
      border-radius: 2px;
      background: hsl(var(--ring, 218 100% 65%) / 0.45);
      opacity: 0;
      transition: opacity 0.15s;
    }
    #split-gutter:hover::after, #split-gutter.drag::after { opacity: 1; }
    #split-gutter:focus-visible::before { width: 3px; background: hsl(var(--ring, 218 100% 65%)); }
    #split-tip {
      position: fixed;
      z-index: 60;
      transform: translate(-50%, 0);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 10px;
      line-height: 16px;
      background: hsl(var(--foreground, 220 21% 92%));
      color: hsl(var(--background, 222 19% 7%));
      box-shadow: 0 2px 8px hsl(0 0% 0% / 0.3);
      display: none;
      pointer-events: none;
      white-space: nowrap;
    }
    body.split #split-gutter { display: block; }

    /* Split mode: the shared strip shows ONE chip per pane, in two segments
       sized by the split ratio — each chip sits directly above its own
       engine view, VS Code editor-group style. */
    #tabs .tab-seg {
      display: flex;
      align-items: stretch;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    /* ── Tab strip ──
       IN DOCUMENT FLOW above the toolbar: the engine view covers all DOM, so
       the strip must squeeze the page slot rather than float. Height changes
       re-fire the slot's ResizeObserver, which repositions the engine — the
       same mechanism the omnibox uses. */
    #tabs {
      display: none;              /* shown by JS when there is more than nothing */
      flex: none;
      align-items: stretch;
      gap: 2px;
      height: 26px;
      padding: 2px 4px 0;
      overflow-x: auto;
      overflow-y: hidden;
      user-select: none;
    }
    #tabs .tab {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 48px;
      max-width: 160px;
      padding: 0 6px;
      border-radius: 6px 6px 0 0;
      font-size: 11px;
      line-height: 22px;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      cursor: default;
      white-space: nowrap;
    }
    #tabs .tab span {
      overflow: hidden; text-overflow: ellipsis;
    }
    #tabs .tab:hover { background: hsl(var(--accent, 221 19% 17%) / 0.5); }
    #tabs .tab.on {
      background: hsl(var(--accent, 221 19% 17%));
      color: hsl(var(--foreground, 220 21% 92%));
    }
    #tabs .tab .x {
      flex: none;
      width: 14px; height: 14px;
      padding: 0;
      border: none; border-radius: 3px;
      background: transparent;
      color: inherit;
      font-size: 11px; line-height: 14px;
      cursor: pointer;
      opacity: 0;
    }
    #tabs .tab:hover .x, #tabs .tab.on .x { opacity: 0.7; }
    #tabs .tab .x:hover { opacity: 1; }
    #tabs .newtab {
      flex: none;
      width: 22px;
      border: none; border-radius: 4px;
      background: transparent;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      font-size: 13px; line-height: 22px;
      cursor: pointer;
    }
    #tabs .newtab:hover { background: hsl(var(--accent, 221 19% 17%)); }

    /* ── Host tabs (2026-11) ─────────────────────────────────────────
       The host owns the tab strip; the in-panel strip and the split view are
       gone. A tab with no page shows the favorites page (DOM), which also
       means the engine view must be hidden: #page-slot[hidden] reports 0×0
       to the live slot. */
    #tabs { display: none !important; }
    #split-gutter, #page-slot-b { display: none !important; }
    #page-slot[hidden] { display: none; }
    #newtab {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 28px 24px;
      background: hsl(var(--background, 222 19% 7%));
    }
    #newtab[hidden] { display: none; }
    .nt-head {
      max-width: 900px;
      margin: 0 auto 14px;
      font-size: 12px;
      letter-spacing: 0.03em;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      user-select: none;
    }
    .nt-grid {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }
    .nt-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px;
      border: 1px solid hsl(var(--border, 218 14% 20%));
      border-radius: 10px;
      background: hsl(var(--card, 222 15% 11%));
      color: hsl(var(--foreground, 220 21% 92%));
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    .nt-card:hover { background: hsl(var(--accent, 221 19% 17%)); }
    .nt-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nt-url {

</head>
<body>
  <div id="tabs"></div>
  <div id="toolbar">
    <button id="btn-back" title="后退" aria-label="后退"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
    <button id="btn-forward" title="前进" aria-label="前进"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    <button id="btn-reload" title="刷新" aria-label="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    <button id="btn-star" title="收藏此页" aria-label="收藏此页" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
    <button id="btn-imt" title="整页工具：翻译 · 朗读 · 解释 · 分析 · 存正文" aria-label="整页工具" aria-expanded="false" aria-controls="imt-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg><svg class="imt-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <input id="url" type="text" spellcheck="false" placeholder="输入网址,回车打开" autocomplete="off" />
  </div>

  <div id="imt-row" hidden>
    <div class="ir-group" id="ir-modes">
      <button type="button" data-imt-mode="dual" title="翻译并保留原文对照">双语</button>

    <div class="ir-group" id="ir-actions">
      <button type="button" data-imt-act="read">朗读</button>
      <button type="button" data-imt-act="explain">解释</button>
      <button type="button" data-imt-act="analyze" title="判断这篇内容是否可信、对你意味着什么">分析</button>
      <button type="button" data-imt-act="save" class="ir-hide-sm" title="把整页正文（含译文）存进划词收藏，可在对话里找回；和地址栏 ★ 的站点收藏不是一回事">存正文</button>
    </div>
    <div class="ir-group" id="ir-read" hidden>
      <button type="button" data-imt-read="prev" class="ir-icon" title="上一段">‹</button>
      <button type="button" data-imt-read="pause" class="ir-icon" title="暂停">❚❚</button>
      <button type="button" data-imt-read="next" class="ir-icon" title="下一段">›</button>
      <button type="button" data-imt-read="stop">停止</button>

    <button type="button" class="ir-close" id="ir-close" title="收起">×</button>
  </div>

  <div id="omnibox" hidden>
    <div id="omni-list"></div>
    <div id="omni-foot">
      <label id="private-wrap" title="开启后,访问过的页面不进入历史记录;登录状态和 cookie 不受影响">
        <input type="checkbox" id="chk-private" /> 不记历史
      </label>
      <label id="sel-wrap" title="开启后,在网页里选中文字会在选区下方弹出操作条">
